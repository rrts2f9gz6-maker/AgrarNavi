<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HofNavi</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#101510;color:white}
header{padding:18px;background:#172018;font-size:24px;font-weight:bold}
header span{color:#a6f326}
main{padding:16px}
.card{background:#202720;border-radius:16px;padding:16px;margin-bottom:14px}
button,select,input{width:100%;padding:13px;margin-top:8px;border-radius:10px;border:0;font-size:16px;box-sizing:border-box}
button{background:#a6f326;font-weight:bold}
.map{height:300px;background:#b8c8a8;border-radius:16px;position:relative;margin-bottom:14px}
.road{position:absolute;background:#666;height:35px;width:120%;top:45%;left:-10%;transform:rotate(-8deg)}
.pin{position:absolute;font-size:32px}
.start{left:20%;top:55%}
.goal{right:20%;top:20%}
.status{padding:12px;border-radius:10px;background:#151a15;margin-top:10px}
.good{color:#a6f326}.warn{color:#ffd25a}
</style>
</head>

<body>

<header>🚜 Hof<span>Navi</span></header>

<main>

<div class="card">
<h2>Dein Fahrzeug</h2>

<select id="type" onchange="changeType()">
<option value="tractor">🚜 Traktor</option>
<option value="truck">🚛 LKW</option>
</select>

<select id="brand">
<option>Fendt</option>
<option>John Deere</option>
<option>CLAAS</option>
<option>Case IH</option>
<option>New Holland</option>
<option>Deutz-Fahr</option>
<option>Valtra</option>
<option>Massey Ferguson</option>
<option>Steyr</option>
<option>Kubota</option>
</select>

<input id="model" value="724 Vario" placeholder="Modell">

<select id="trailer">
<option>Kein Anhänger</option>
<option>Tandem</option>
<option>Tridem</option>
<option>Drehschemel</option>
<option>Tieflader</option>
<option>Güllewagen</option>
<option>Kipper</option>
</select>

<input id="width" type="number" step="0.01" value="3.05" placeholder="Breite in Metern">
<input id="height" type="number" step="0.01" value="4.10" placeholder="Höhe in Metern">
<input id="length" type="number" step="0.1" value="7.20" placeholder="Gesamtlänge in Metern">
<input id="weight" type="number" step="0.1" value="12.5" placeholder="Gewicht in Tonnen">
<input id="radius" type="number" step="0.1" value="7" placeholder="Wenderadius in Metern">

<button onclick="save()">💾 Gespann speichern</button>
</div>

<div class="card">
<h2>🗺️ Navigation</h2>

<div class="map">
<div class="road"></div>
<div class="pin start">🚜</div>
<div class="pin goal">🎯</div>
</div>

<input id="target" value="Feld 17 – Einfahrt Süd" placeholder="Ziel eingeben">

<button onclick="route()">🧭 Route berechnen</button>

<div id="status" class="status">
Bereit. Gib dein Ziel ein.
</div>

</div>

<div class="card">
<h2>📍 Hof / Feld speichern</h2>

<input id="place" placeholder="Name, z.B. Hof Müller">

<button onclick="savePlace()">📍 Punkt speichern</button>

<div id="places"></div>
</div>

</main>

<script>

function changeType(){

let type=document.getElementById("type").value;

if(type==="truck"){

document.getElementById("brand").innerHTML=`
<option>MAN</option>
<option>Mercedes-Benz</option>
<option>Scania</option>
<option>Volvo</option>
<option>DAF</option>
<option>Iveco</option>
`;

document.getElementById("model").value="TGX";
document.getElementById("width").value="2.55";
document.getElementById("height").value="4.00";
document.getElementById("length").value="16.50";
document.getElementById("weight").value="40";
document.getElementById("radius").value="12";

}else{

document.getElementById("brand").innerHTML=`
<option>Fendt</option>
<option>John Deere</option>
<option>CLAAS</option>
<option>Case IH</option>
<option>New Holland</option>
<option>Deutz-Fahr</option>
<option>Valtra</option>
<option>Massey Ferguson</option>
<option>Steyr</option>
<option>Kubota</option>
`;

document.getElementById("model").value="724 Vario";
document.getElementById("width").value="3.05";
document.getElementById("height").value="4.10";
document.getElementById("length").value="7.20";
document.getElementById("weight").value="12.5";
document.getElementById("radius").value="7";

}

}

function save(){

document.getElementById("status").innerHTML=
"🟢 <span class='good'>Gespann gespeichert.</span><br>"+
document.getElementById("brand").value+" "+
document.getElementById("model").value+
" · "+document.getElementById("trailer").value;

}

function route(){

let width=parseFloat(document.getElementById("width").value);
let length=parseFloat(document.getElementById("length").value);
let radius=parseFloat(document.getElementById("radius").value);

let securityWidth=
2*(radius+(length/2)+(width/2));

if(securityWidth>6.5){

document.getElementById("status").innerHTML=
"🟠 <span class='warn'>Engstelle erkannt.</span><br>"+
"HofNavi würde diese Strecke im Sicherheitsmodus nicht bevorzugen.<br><br>"+
"➡️ Alternative Route wird benötigt.";

}else{

document.getElementById("status").innerHTML=
"🟢 <span class='good'>Route vorläufig passend.</span><br>"+
"Keine kritische Engstelle im Demo-Test erkannt.";

}

}

function savePlace(){

let place=document.getElementById("place").value;

if(!place)return;

let div=document.createElement("div");

div.innerHTML="📍 "+place;

div.style.padding="10px 0";

document.getElementById("places").appendChild(div);

document.getElementById("place").value="";

}

</script>

</body>
</html>
